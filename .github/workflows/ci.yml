name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libffi-dev libssl-dev python3-dev psmisc procps
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
      - name: Debug environment
        run: |
          which python3
          python3 --version
      - name: Kill any existing servers
        run: |
          pkill -9 -f "python3.*server.py" || true
          fuser -k ${CPIP_TEST_PORT:-4182}/tcp || true
          sleep 1
      - name: Syntax check
        run: python3 -m py_compile server.py providers/*.py
      - name: Run tests
        run: |
          python3 -m pytest test_cpip.py test_crypto.py -v 2>&1 | tail -40
      - name: Validate cpip syntax
        run: bash -n cpip
      - name: Build radio interface
        run: make -C radio clean radio_if 2>/dev/null || echo "radio build skipped"

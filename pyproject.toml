[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cpip"
version = "5.1.1"
description = "Coffee Pot Internet Protocol — RFC 2324 + RFC 7168 + mesh network"
readme = "README.md"
license = {text = "Unlicense"}
requires-python = ">=3.10"
keywords = ["cpip", "coffee", "tea", "rfc2324", "mesh", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "License :: Public Domain",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Internet :: RFC",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "cryptography >= 49.0.0",
    "numpy >= 2.5.1",
    "pqcrypto >= 0.4.0",
]

[project.optional-dependencies]
tui = ["opentui >= 0.1.2"]
cli = ["rich >= 15.0.0"]
hsm = ["pkcs11 >= 1.0.4"]
all = ["opentui>=0.1.2", "rich>=15.0.0", "pkcs11>=1.0.4"]

[project.urls]
Homepage = "https://github.com/WilliamMajanja/CPIP-"
RFC-2324 = "https://datatracker.ietf.org/doc/html/rfc2324"
RFC-7168 = "https://datatracker.ietf.org/doc/html/rfc2168"

[project.scripts]
cpip-server = "server:main"
cpip-gui = "cpip_gui:main"
cpip-tui = "cpip_tui:main"
cpip-cw = "b4dm4n_cw:main"

[tool.setuptools]
packages = {find = {include = ["providers", "providers.*"]}}
py-modules = [
    "server", "cpip_gui", "cpip_tui", "b4dm4n_cw",
    "inf1del_kyber",
]

[tool.setuptools.package-data]
radio = ["*.py", "*.c", "*.h", "Makefile", "radio_if"]
